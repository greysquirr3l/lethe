[workspace]
members = [
    "crates/lethe-core",
    "crates/lethe-substrates",
    "crates/lethe-model",
    "crates/lethe-diagnostic",
    "crates/lethe-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/nickcampbell/lethe"
readme = "README.md"
keywords = ["lethe", "substrate", "dynamics", "science"]
categories = ["science", "simulation"]

[workspace.dependencies]
lethe-core = { path = "crates/lethe-core" }
lethe-substrates = { path = "crates/lethe-substrates" }
lethe-model = { path = "crates/lethe-model" }
lethe-diagnostic = { path = "crates/lethe-diagnostic" }
rand_chacha = "0.9"
rand_core = "0.9"

[workspace.lints.clippy]
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
suspicious = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"
