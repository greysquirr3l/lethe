name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -W clippy::perf -A clippy::module_name_repetitions -A clippy::must_use_candidate -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::struct_excessive_bools -A clippy::multiple_crate_versions -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing -D clippy::cast_ptr_alignment -D clippy::suspicious -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

      - name: Generate repro output
        run: cargo run -p lethe-cli -- repro --seed 424242 --steps 1024 --output repro-${{ matrix.runner }}.bin

      - name: Upload repro output
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.runner }}
          path: repro-${{ matrix.runner }}.bin

  repro-compare:
    name: repro-compare
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: repro-ubuntu-latest
          path: artifacts

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: repro-ubuntu-24.04-arm
          path: artifacts

      - name: Compare bytes
        run: cmp -s artifacts/repro-ubuntu-latest.bin artifacts/repro-ubuntu-24.04-arm.bin
