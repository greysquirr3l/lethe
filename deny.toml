[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-org = []
